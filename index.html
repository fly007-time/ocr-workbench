<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>识表 · OCR 与匹配工作台</title><link rel="stylesheet" href="style.css?v=20261102-zoom"><link rel="stylesheet" href="workbench-theme.css?v=20261102-comfort"><link rel="stylesheet" href="vendor/cropper.min.css"></head><body>
<header class="topbar"><button class="mobile-menu" id="fileToggle" aria-label="打开文件列表">文件</button><div class="brand"><span class="brand-mark">识</span><div><strong>识表工作台</strong><small>OCR · 校对 · 匹配 · 汇总</small></div></div><nav id="steps" aria-label="处理步骤"><button data-step="1"><span>1</span>导入与识别</button><button data-step="2"><span>2</span>表格校对</button><button data-step="3"><span>3</span>匹配汇总</button><button data-step="4"><span>4</span>结果导出</button></nav><button id="settingsOpen" class="quiet">设置</button></header>
<div class="shell"><aside id="sidebar"><div class="side-title"><strong>本次任务</strong><span id="fileCount" class="count">0</span></div><label class="add-files">＋ 添加文件<input id="filesInput" type="file" accept=".png,.jpg,.jpeg,.bmp,.pdf,.xlsx,.xls,.docx" multiple hidden></label><label class="folder-label">选择文件夹<input id="folderInput" type="file" webkitdirectory multiple hidden></label><div id="fileList" class="file-list"></div><div class="side-bottom"><div id="jobStatus">准备就绪</div><button id="clearAll" class="clear-task-button" type="button" title="清空任务文件、表格及汇总；保留黄金对照表和汇总样表"><svg class="clear-task-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg><span>清空本次任务</span></button><small class="clear-task-hint">保留黄金对照表和汇总样表</small><small>文件解析与金额汇总在浏览器内进行</small></div><div id="sidebarResize" role="separator" tabindex="0" aria-label="调整任务栏宽度" aria-orientation="vertical" aria-valuemin="180" aria-valuemax="460" aria-valuenow="220" title="左右拖动调整任务栏宽度；方向键也可调整"></div></aside><main id="workspace" aria-live="polite"></main></div>
<footer class="actionbar"><div id="actionHint">上传文件，开始本次任务</div><div id="footerActions" class="actions"></div></footer>
<div id="notice" role="status" hidden></div>
<section id="settings" class="settings-panel" aria-label="工作台设置" tabindex="-1"><div class="dialog-head"><div><span class="eyebrow">WORKSPACE SETTINGS</span><h2>工作台设置</h2></div></div><div class="setting-section"><h3>OCR 识别</h3><label>智谱 API Key<input id="apiKey" type="password" autocomplete="off" placeholder="仅在本次会话使用"></label><label>并发数<input id="concurrency" type="number" min="1" max="10" value="2"></label><p class="muted">使用你自己的 Key，识别费用由你承担。仅点击识别时，所选图片及 PDF 页面会发送至智谱；解析和汇总在浏览器完成。Key 仅在当前页面会话保留。</p></div><div class="setting-section"><h3>匹配参数</h3><label>匹配阈值 <output id="thresholdValue">0.55</output><input id="threshold" type="range" min="0.30" max="0.95" step="0.05" value="0.55"></label><p class="muted">低于 70% 或候选分差小于 5 个百分点时，等待人工确认。</p></div><div class="setting-section"><h3>当前表格的解析设置</h3><div id="columnSettings"><p class="muted">选择表格后可调整表头及列位置。</p></div></div><div class="setting-section"><h3>显示设置</h3><label>表格密度<select id="displayDensity" aria-label="表格密度"><option value="comfortable">舒适 · 标准行距</option><option value="compact">紧凑 · 显示更多行</option></select></label></div><div class="setting-section"><h3>组件状态</h3><div id="libStatus" class="muted">正在加载网页组件…</div><button id="reloadLibs">重新加载</button></div></section>
<dialog id="referenceDialog" class="reference-dialog"><div class="dialog-head"><h2 id="referenceTitle">参考表预览</h2><button data-close="referenceDialog">关闭</button></div><select id="referenceSheet" aria-label="参考工作表"></select><p id="referenceHint" class="muted"></p><div id="referenceTable"></div></dialog>
<input id="refInput" type="file" accept=".xls,.xlsx" hidden><input id="tplInput" type="file" accept=".xls,.xlsx" hidden>
<script src="bootstrap.js?v=20261102-comfort"></script></body></html>
